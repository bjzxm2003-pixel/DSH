name: 内容管线（选题+成稿）

on:
  schedule:
    # 北京时间每天 18:00（GitHub cron 用 UTC）
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行内容管线（选题侦察 → LLM 成稿）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python content_pipeline.py

      - name: 提交 content.json（先 rebase 合并其他工作流的提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "内容管线 $(date -u +%Y-%m-%d): 选题+成稿自动更新"
          # 监控工作流可能并发提交过 matched.json/history.json，rebase 后再推
          git pull --rebase origin main || true
          git push origin main
